name: CI/CD

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  IMAGE_NAME: todaysound-server

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Spring Boot app
        run: ./gradlew clean bootJar -x test -x asciidoctor
        env:
          SPRING_PROFILES_ACTIVE: ci

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          GIT_SHA=${GITHUB_SHA::7}
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${GIT_SHA} .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${GIT_SHA}

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Get Terraform Outputs
        run: |
          # Get workspace ID
          WORKSPACE_RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.TFC_TOKEN }}" \
            "https://app.terraform.io/api/v2/organizations/todaysound/workspaces/terraform-infra")

          WORKSPACE_ID=$(echo "$WORKSPACE_RESPONSE" | jq -r '.data.id')
          echo "Workspace ID: $WORKSPACE_ID"

          if [ "$WORKSPACE_ID" = "null" ] || [ -z "$WORKSPACE_ID" ]; then
            echo "Failed to get workspace ID"
            echo "$WORKSPACE_RESPONSE" | jq .
            exit 1
          fi

          # Get outputs from current state
          OUTPUTS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.TFC_TOKEN }}" \
            "https://app.terraform.io/api/v2/workspaces/${WORKSPACE_ID}/current-state-version?include=outputs")

          if echo "$OUTPUTS" | jq -e '.included' > /dev/null 2>&1; then
            echo "Outputs fetched successfully"
          else
            echo "Failed to get outputs - Terraform may not have been applied yet"
            echo "$OUTPUTS" | jq .
            exit 1
          fi

          # Extract values
          get_output() {
            echo "$OUTPUTS" | jq -r --arg name "$1" '.included[] | select(.attributes.name==$name) | .attributes.value'
          }

          echo "EC2_HOST=$(get_output main_server_ip)" >> $GITHUB_ENV
          echo "RDS_ADDRESS=$(get_output rds_address)" >> $GITHUB_ENV
          echo "S3_BUCKET=$(get_output s3_bucket_name)" >> $GITHUB_ENV
          echo "S3_LOGS_BUCKET=$(get_output s3_logs_bucket_name)" >> $GITHUB_ENV

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DB_URL: jdbc:mysql://${{ env.RDS_ADDRESS }}:3306/${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          S3_BUCKET: ${{ env.S3_BUCKET }}
          S3_LOGS_BUCKET: ${{ env.S3_LOGS_BUCKET }}
          FCM_JSON: ${{ secrets.FCM_JSON }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: DOCKER_USERNAME,IMAGE_NAME,DB_URL,DB_USERNAME,DB_PASSWORD,DB_NAME,S3_BUCKET,S3_LOGS_BUCKET,FCM_JSON,SENTRY_DSN,SENTRY_AUTH_TOKEN
          script: |
            set -e
            cd ~/app

            # Write app environment variables
            cat > .env << ENVEOF
SPRING_PROFILES_ACTIVE=prod
DB_URL=${DB_URL}
DB_USERNAME=${DB_USERNAME}
DB_PASSWORD=${DB_PASSWORD}
S3_BUCKET=${S3_BUCKET}
S3_LOGS_BUCKET=${S3_LOGS_BUCKET}
FCM_JSON=${FCM_JSON}
SENTRY_DSN=${SENTRY_DSN}
SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
ENVEOF

            # Pull new image and restart app only
            docker compose pull app
            docker compose up -d app
            docker image prune -f

            # Health check
            echo "Waiting for app to start..." && sleep 45

            set +e
            HEALTH_CHECK_PASSED=false
            for i in {1..15}; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/actuator/health 2>/dev/null)
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
                echo "Health check passed! HTTP code: $HTTP_CODE"
                HEALTH_CHECK_PASSED=true
                break
              else
                echo "Attempt $i failed, HTTP code: $HTTP_CODE, retrying in 5s..."
                sleep 5
              fi
            done
            set -e

            if [ "$HEALTH_CHECK_PASSED" = "false" ]; then
              echo "Health check failed after 15 attempts"
              docker logs todaysound-server --tail 50 || true
              exit 1
            fi
